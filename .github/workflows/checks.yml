# `nix flake check`, fanned out one job per check.
#
# Why this exists: the matrix VM checks `hookshot_infra_alerts` and `hookshot_adminroom`
# sat RED on main undetected, because `nix flake check` was a purely manual gate and one
# of the two failures arrived via a flake.lock bump rather than a commit. Both guarded a
# failure mode that had already taken the fleet's alerting channel down for four weeks
# (ADR-0017). A gate nobody is obliged to run is not a gate.
#
# No secrets are needed — see ci/no-secrets/README.md and ADR-0012.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include-git-annex:
        description: "Also run the git-annex VM checks (slow)"
        type: boolean
        default: false
      only:
        description: "Run only checks whose name contains this substring (blank = all)"
        type: string
        default: ""

# A newer push supersedes an in-flight run for the same ref; main is never cancelled.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The private `secrets` input, replaced by an empty tracked directory so every
  # lib.getSecret* lookup takes its mock fallback (ADR-0012).
  OVERRIDE: --override-input secrets path:./ci/no-secrets

  # Checks this environment cannot run. These are NOT known failures — each one passes
  # locally — so keep the list short, and always record why. The skip is printed in the
  # discover job so it never becomes invisible.
  #
  #   contract_seat, host_fleet_coherence, netns_container_binding
  #     evaluate the whole fleet/user configuration, which needs the *second* private
  #     flake input, `users` (ssh://git@github.com/palebluebytes/users). ADR-0012's mock
  #     fallback covers `secrets` only, so these fail at eval with "Failed to fetch git
  #     repository". Re-enable by giving the workflow a read-only deploy key for that
  #     repo — nothing in the checks themselves needs changing.
  #
  #   git_annex_alert
  #     git-annex is not substitutable for this nixpkgs rev, so CI builds it from source
  #     and git-annex's OWN test suite fails in the runner sandbox. Upstream's problem,
  #     and ~9 minutes of runner time to rediscover it each run.
  EXCLUDE: contract_seat host_fleet_coherence netns_container_binding git_annex_alert

jobs:
  # Enumerate the checks from the flake itself, so a newly added check is picked up
  # without editing this file.
  discover:
    runs-on: ubuntu-24.04
    # Just a flake eval; if it has not answered by now it is wedged, not slow.
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - id: list
        name: List checks
        env:
          INCLUDE_GIT_ANNEX: ${{ inputs.include-git-annex }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          # stderr carries the "Git tree is dirty" / mock warnings; keep it off stdout.
          all=$(nix eval --json $OVERRIDE \
            .#checks.x86_64-linux --apply builtins.attrNames 2>/dev/null)
          if [ "${INCLUDE_GIT_ANNEX:-false}" = "true" ]; then
            sel=$(jq -c '.' <<<"$all")
          else
            # The git-annex VM suite is a dozen multi-node tests and by far the slowest
            # part of the flake. Excluded by default; workflow_dispatch can opt in.
            # `git_annex_alert` (underscore) is a cheap alerting check and is kept.
            sel=$(jq -c '[.[] | select(startswith("git-annex") | not)]' <<<"$all")
          fi
          # Drop the environment-limited checks (see EXCLUDE above), and say so.
          for x in $EXCLUDE; do
            sel=$(jq -c --arg x "$x" '[.[] | select(. != $x)]' <<<"$sel")
            echo "  SKIPPED (see EXCLUDE in this workflow): $x"
          done
          if [ -n "${ONLY:-}" ]; then
            # Match against the FULL list, so `only` can deliberately target an
            # excluded check to re-test it.
            sel=$(jq -c --arg q "$ONLY" '[.[] | select(contains($q))]' <<<"$all")
            [ "$(jq -r 'length' <<<"$sel")" -gt 0 ] || {
              echo "::error::no check name contains '$ONLY'"; exit 1; }
          fi
          echo "checks=$sel" >> "$GITHUB_OUTPUT"
          jq -r '.[]' <<<"$sel" | sed 's/^/  will run: /'

  check:
    needs: discover
    runs-on: ubuntu-24.04
    # A hard ceiling, not an expectation: the jobs run in parallel, so wall-clock is
    # the slowest single check (cold, dominated by substituting its closure), not the
    # sum. Without this a VM test that hangs waiting on a unit would sit for GitHub's
    # 6-hour default and hold the whole run open.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover.outputs.checks) }}
    name: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@v5

      # Almost every check is a NixOS VM test, which wants /dev/kvm. GitHub's Linux
      # runners expose it, but not writable by the runner user by default.
      #
      # This step must never fail the job. `run:` uses `bash -e`, so an earlier version
      # ending in a bare `test -w /dev/kvm` aborted every check job in seconds when the
      # device was not writable — a setup step masquerading as 22 check failures. The
      # test driver falls back to TCG software emulation anyway; it is only much slower,
      # which is worth a warning, not a hard stop.
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
          fi
          if [ -w /dev/kvm ]; then
            echo "KVM: hardware acceleration available"
          else
            echo "::warning title=No KVM::/dev/kvm is $([ -e /dev/kvm ] && echo 'present but not writable' || echo absent); VM tests fall back to software emulation and will be slow"
            ls -l /dev/kvm 2>&1 || true
          fi

      # Reclaim ~30 GB of preinstalled toolchains; a VM-test closure plus nixpkgs
      # does not fit comfortably on a stock runner otherwise.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          # The fleet's own substituters, all public-read, so CI substitutes the same
          # closures the hosts do instead of compiling them (keys from
          # modules/nixos/profiles/nixConfig.nix).
          extra_nix_config: |
            substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com https://palebluebytes.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= palebluebytes.cachix.org-1:LzASburC4RYH9jQaOwB9r4heDPYWTbdA54XPMsLMeDc=

      - name: nix build .#checks.x86_64-linux.${{ matrix.check }}
        run: |
          nix build -L --no-link $OVERRIDE \
            ".#checks.x86_64-linux.${{ matrix.check }}"
